name: Verificar resultados
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resultados_test
          POSTGRES_PASSWORD: pruebas_ci_exclusivas
          POSTGRES_DB: resultados_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U resultados_test -d resultados_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RESULTADOS_DATABASE_URL: postgresql://resultados_test:pruebas_ci_exclusivas@127.0.0.1:5432/resultados_test
      TEST_RESULTADOS_DATABASE_URL: postgresql://resultados_test:pruebas_ci_exclusivas@127.0.0.1:5432/resultados_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run migrate
      - run: node --test dist/test/unit.test.js dist/test/integration.test.js
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --experimental-strip-types --test test/policy.test.ts
